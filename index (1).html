<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualiseur M1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f2;--fg:#1c2024;--bar:#e3e6e3;--grid:#cfd4d0;--up:#14946a;--dn:#cf4a3c;--acc:#1f6f8b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181b;--fg:#e4e8e6;--bar:#232a2e;--grid:#2f383d;--up:#2fc08f;--dn:#ee6a5a;--acc:#4aa7c4}}
:root[data-theme="dark"]{--bg:#14181b;--fg:#e4e8e6;--bar:#232a2e;--grid:#2f383d;--up:#2fc08f;--dn:#ee6a5a;--acc:#4aa7c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
#tb{display:flex;align-items:center;gap:5px;padding:4px 6px;overflow-x:auto;flex:none;min-width:0}
#tb button,#tb select{min-height:32px;padding:0 9px;font-size:13px;border-radius:7px}
#tb label{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
#graphsBtn{margin-left:auto;flex:none;max-width: min(42vw,190px);overflow:hidden;text-overflow:ellipsis}
#graphMenu{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));right:8px;z-index:12;display:flex;flex-direction:column;gap:4px;min-width:210px;max-width:min(320px,calc(100vw - 16px));max-height:60vh;overflow:auto;padding:7px;background:var(--bar);border:1px solid var(--grid);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
#graphMenu[hidden]{display:none}
.graphItem{display:flex;align-items:center;gap:5px;min-width:0}
.graphItem .graphName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.graphItem .graphClose{min-width:32px;min-height:32px;padding:0 8px;border-left:1px solid var(--grid);color:var(--dn)}
.graphItem.active .graphName{background:var(--acc);color:#fff}
button,select,input[type=datetime-local]{min-height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--grid);background:var(--bar);color:var(--fg);font:inherit;white-space:nowrap}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#c{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#st{padding:6px 10px;font-size:12px;opacity:.85;flex:none}
#ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:5}
#ov[hidden]{display:none}
#ov textarea{flex:1;font:12px monospace;background:var(--bar);color:var(--fg);border:1px solid var(--grid);border-radius:8px}
#ov div{display:flex;gap:6px;flex-wrap:wrap}
#cs{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:8px;z-index:6;background:var(--bar);border:1px solid var(--grid);border-radius:10px;padding:10px;display:grid;grid-template-columns:auto 56px;gap:8px 14px;align-items:center}
#cs[hidden]{display:none}
#cs input[type=color]{width:56px;height:38px;padding:0;border:1px solid var(--grid);border-radius:6px;background:none}
#cbtn{grid-column:1/-1;display:flex;gap:8px}
#cbtn button{flex:1}
#fb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:7;display:none;gap:6px}
body.fs #fb{display:flex}
#fb button{opacity:.85}
body.fs #tb,body.fs #st{display:none}
body.fs.tbo #tb{display:flex;position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:0;right:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--grid)}
#pop{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--bar);border:1px solid var(--grid);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#pop[hidden]{display:none}
#pop button{min-height:38px;padding:0 10px}
button:disabled{opacity:.45}
[hidden]{display:none!important}
#pop,#ap,#mn{position:absolute;z-index:3;display:flex;flex-direction:column;box-sizing:border-box;padding:10px;background:var(--bar);border:1px solid var(--grid);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#pop{top:8px;left:50%;transform:translateX(-50%);width:360px;max-width:calc(100% - 16px);gap:10px}
#ap{top:8px;left:8px;width:340px;max-width:calc(100% - 16px);gap:10px}
#mn{right:8px;bottom:64px;gap:6px}
#mn button{text-align:left}
.ttl{font-weight:600;font-size:14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:0}
.fld>input,.fld>select,.fld>.seg{width:100%;box-sizing:border-box}
.g3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4 button{padding:0 2px;font-size:13px}
.row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:8px;font-size:13px}
.row input{min-width:0;width:100%;box-sizing:border-box}
.seg{display:grid;grid-template-columns:1fr 1fr}
.seg button{border-radius:0;padding:0 6px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left-width:0}
.seg button.on+button.on{box-shadow:inset 1px 0 0 rgba(255,255,255,.55)}
.seg button{font-size:14px}
#pop input[type=color]{height:42px;padding:2px;border:1px solid var(--grid);border-radius:8px;background:var(--bar)}
#ap button{width:100%}
#aok{background:var(--acc);color:#fff;border-color:var(--acc)}
body.fs #graphsBtn,body.fs #graphMenu{display:none}
#cf{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
#cf .box{background:var(--bar);border:1px solid var(--grid);border-radius:12px;padding:16px;width:320px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:14px}
.dg{background:var(--dn);color:#fff;border-color:var(--dn)}
#mb{position:absolute;right:16px;bottom:26px;z-index:3;width:32px;height:32px;min-height:32px;padding:0;font-size:18px;line-height:1;border-radius:7px;background:var(--cbg,var(--bar));color:var(--ctx,var(--fg));border:1.5px solid var(--ctx,var(--grid))}
</style></head><body>
<div id="tb">
<button id="load">Charger un CSV</button><input id="f" type="file" hidden multiple>
<select id="tf" title="Période"><option value="1">M1</option><option value="5">M5</option><option value="15">M15</option><option value="60">H1</option></select>
<button id="an">Analyser</button>
<button id="graphsBtn" type="button" aria-expanded="false">Graphiques ▾</button>
</div>
<div id="graphMenu" hidden></div>
<div id="c"><canvas id="cv"></canvas>
<div id="pop" hidden><div class="g3"><label class="fld">Couleur<input type="color" id="pco"></label><label class="fld">Épaisseur<select id="pw"><option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="5">5 px</option><option value="6">6 px</option></select></label><div class="fld" id="plf">Remplissage<div class="seg"><button id="pfp">Plein</button><button id="pfv">Vide</button></div></div></div><div class="g4"><button id="pcp">Copier</button><button id="ppa">Coller</button><button id="pde">Supprimer</button><button id="plk">Bloquer</button></div></div>
<div id="ap" hidden><div class="ttl">Analyse</div><label class="row">Début<input id="d1" type="datetime-local"></label><label class="row">Fin<input id="d2" type="datetime-local"></label><button id="av">Période = vue</button><div class="fld">Afficher<div class="seg"><button id="vm" class="on">Manuel</button><button id="va" class="on">Auto</button></div></div><div class="g2"><button id="au">Annuler l’analyse</button><button id="aok">OK</button></div></div>
<div id="mn" hidden><button data-t="seg">Segment</button><button data-t="zone">Zone</button><button id="cb">Couleurs</button><button id="fsb">Plein écran</button><button id="dt">Données</button></div>
<button id="mb" title="Menu">⋮</button>
</div>
<div id="st">Charge un CSV M1 exporté de MT5.</div>
<div id="fb"><button id="tbo">☰</button><button id="fx">✕</button></div>
<div id="cs" hidden><span>Bougie haussière</span><input type="color" id="cu"><span>Bougie baissière</span><input type="color" id="cd"><span>Fond du graphique</span><input type="color" id="cg"><span>Grille</span><input type="color" id="cr"><span>Texte et axes</span><input type="color" id="ct"><div id="cbtn"><button id="crs">Réinitialiser</button><button id="cok">Appliquer</button></div></div>
<div id="ov" hidden><textarea id="ta"></textarea><div><button id="ex">Exporter</button><button id="im">Importer</button><button id="cp">Copier</button><button id="cl">Fermer</button></div></div>
<div id="cf" hidden><div class="box"><div id="cft"></div><div class="g2"><button id="cfn">Annuler</button><button id="cfy" class="dg">Supprimer</button></div></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');
const COL={libre:'#2a8bd6',RB:'#2a8bd6',RH:'#8a5fe0',BOS:'#e8890c',supply:'#d6453d',demand:'#1a9e5c'};
let M=null,B=null,tf=1,O=[],tool='pan',tp='libre',X0=0,N=150,W=0,H=0,lo=0,hi=1,dr=null,ml=null,mh=null,CC={},sel=null,dh=null,clip=null,multi=0,pacc=0,lastSel=null,charts=[],act=null,busy=0,tmr=0;
const CM={up:'--up',dn:'--dn',bg:'--bg',grid:'--grid',tx:'--fg'};
const show={manuel:1,auto:1},P=new Map(),AX=44,BY=18,len=()=>B?B.t.length:0,st=m=>$('#st').textContent=m;
const iso=t=>new Date(t*1000).toISOString().slice(0,16).replace('T',' ');

/* Point d’accroche : brancher ici la fonction d’analyse.
   m = {t,o,h,l,c} (tableaux M1, t en secondes UTC).
   Retourne [{kind:'seg'|'zone', type:'RB'|'RH'|'BOS'|'supply'|'demand', t1,p1,t2,p2}] */
function ANALYSE(m){return [];}

function parse(buf){
 const u=new Uint8Array(buf);let e='utf-8';
 if(u[0]==255&&u[1]==254)e='utf-16le';else if(u[0]==254&&u[1]==255)e='utf-16be';
 const r={t:[],o:[],h:[],l:[],c:[]};
 for(const ln of new TextDecoder(e).decode(buf).split(/\r?\n/)){
  const p=ln.replace(/^\uFEFF/,'').split(/[\t;,]/);if(p.length<5)continue;
  const s=p[1].includes(':')?1:0,d=p[0].split(/[.\-\/]/).map(Number),m=(s?p[1]:'0:0:0').split(':').map(Number),v=p.slice(1+s,5+s).map(Number);
  if(d.length<3||d.some(isNaN)||v.some(isNaN))continue;
  r.t.push(Date.UTC(d[0],d[1]-1,d[2],m[0]||0,m[1]||0,m[2]||0)/1000);r.o.push(v[0]);r.h.push(v[1]);r.l.push(v[2]);r.c.push(v[3]);
 }
 for(const k in r)r[k]=Float64Array.from(r[k]);
 return r;
}
function agg(k){
 if(k==1)return M;const s=k*60,r={t:[],o:[],h:[],l:[],c:[]};let last=-1;
 for(let i=0;i<M.t.length;i++){
  const b=Math.floor(M.t[i]/s)*s;
  if(b!=last){r.t.push(b);r.o.push(M.o[i]);r.h.push(M.h[i]);r.l.push(M.l[i]);r.c.push(M.c[i]);last=b}
  else{const j=r.t.length-1;if(M.h[i]>r.h[j])r.h[j]=M.h[i];if(M.l[i]<r.l[j])r.l[j]=M.l[i];r.c[j]=M.c[i]}
 }
 return r;
}
function ix(t){const a=B.t;let l=0,h=a.length-1;if(t<=a[0])return(t-a[0])/(tf*60);
 while(l<h){const m=(l+h+1)>>1;if(a[m]<=t)l=m;else h=m-1}return l+(t-a[l])/(tf*60)}
function tm(i){const a=B.t,k=Math.max(0,Math.min(a.length-1,Math.floor(i)));return a[k]+(i-k)*tf*60}
const xp=i=>(i-X0)/N*(W-AX),yp=p=>(hi-p)/(hi-lo)*(H-BY),px=x=>tm(X0+x/(W-AX)*N),py=y=>hi-y/(H-BY)*(hi-lo);
function clamp(){N=Math.max(15,Math.min(N,Math.max(15,len())));X0=Math.max(-N*.3,Math.min(X0,len()-N*.7))}
function setTF(k){const c=len()?tm(X0+N/2):null;tf=k;B=agg(k);if(c!=null)X0=ix(c)-N/2;clamp()}

function draw(){sync();saveSoon();
 const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;
 if(cv.width!=Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d)}
 g.setTransform(d,0,0,d,0,0);
 const css=getComputedStyle(document.documentElement),v=n=>css.getPropertyValue(n).trim(),cc=k=>CC[k]||v(CM[k]);document.documentElement.style.setProperty('--cbg',cc('bg'));document.documentElement.style.setProperty('--ctx',cc('tx'));
 g.fillStyle=cc('bg');g.fillRect(0,0,W,H);if(!len())return;
 const cw=W-AX,ch=H-BY,a=Math.max(0,Math.floor(X0)),b=Math.min(len()-1,Math.ceil(X0+N));
 lo=1e18;hi=-1e18;for(let i=a;i<=b;i++){if(B.l[i]<lo)lo=B.l[i];if(B.h[i]>hi)hi=B.h[i]}
 if(lo>hi){lo=0;hi=1}if(hi<=lo)hi=lo+1;const pd=(hi-lo)*.06;lo-=pd;hi+=pd;if(ml!=null){lo=ml;hi=mh}
 g.font='9px system-ui';g.textBaseline='middle';
 for(let k=0;k<=5;k++){const p=lo+(hi-lo)*k/5,y=yp(p);g.strokeStyle=cc('grid');g.beginPath();g.moveTo(0,y);g.lineTo(cw,y);g.stroke();g.fillStyle=cc('tx');g.fillText(p.toFixed(2),cw+4,y)}
 g.textBaseline='alphabetic';g.font='9px system-ui';const st4=Math.max(1,Math.round(N/4));
 for(let i=Math.ceil(X0/st4)*st4;i<X0+N;i+=st4){if(i<0||i>=len())continue;g.fillStyle=cc('tx');g.fillText(iso(B.t[i]).slice(5),xp(i)+2,H-6)}
 g.strokeStyle=cc('tx');g.lineWidth=1;g.beginPath();g.moveTo(cw+.5,0);g.lineTo(cw+.5,ch+.5);g.lineTo(0,ch+.5);g.stroke();
 for(let k=0;k<=5;k++){const y=Math.round(yp(lo+(hi-lo)*k/5))+.5;g.beginPath();g.moveTo(cw,y);g.lineTo(cw+4,y);g.stroke()}
 for(let i=Math.ceil(X0/st4)*st4;i<X0+N;i+=st4){if(i<0||i>=len())continue;const x=Math.round(xp(i))+.5;g.beginPath();g.moveTo(x,ch);g.lineTo(x,ch+4);g.stroke()}
 g.save();g.beginPath();g.rect(0,0,cw,ch);g.clip();
 const bw=cw/N;
 if(1440/tf*bw>=6){g.save();g.setLineDash([5,4]);g.strokeStyle=cc('tx');g.globalAlpha=.5;g.lineWidth=1;const dd=t=>Math.floor(t/86400);
  for(let i=Math.max(a,1);i<=b;i++)if(dd(B.t[i])!=dd(B.t[i-1])){const x=Math.round(xp(i))+.5;g.beginPath();g.moveTo(x,0);g.lineTo(x,ch);g.stroke()}
  g.restore()}
 for(let i=a;i<=b;i++){
  const x=xp(i+.5),up=B.c[i]>=B.o[i];g.strokeStyle=g.fillStyle=up?cc('up'):cc('dn');
  g.beginPath();g.moveTo(x,yp(B.h[i]));g.lineTo(x,yp(B.l[i]));g.stroke();
  if(bw>2){const y1=yp(Math.max(B.o[i],B.c[i])),y2=yp(Math.min(B.o[i],B.c[i]));g.fillRect(x-bw*.35,y1,bw*.7,Math.max(1,y2-y1))}
 }
 for(const id of['#d1','#d2']){const s=$(id).value;if(s){const x=xp(ix(Date.parse(s+'Z')/1000));g.save();g.setLineDash([4,4]);g.strokeStyle=v('--acc');g.beginPath();g.moveTo(x,0);g.lineTo(x,ch);g.stroke();g.restore()}}
 const all=O.filter(o=>show[o.src]).concat(dr?[dr]:[]);
 for(const o of all){
  const x1=xp(ix(o.t1)),x2=xp(ix(o.t2)),y1=yp(o.p1),y2=yp(o.p2),c=COL[o.type]||COL.libre;
  g.strokeStyle=g.fillStyle=o.color||c;g.lineWidth=o.w||2;
  if(o.kind=='zone'){if(o.fill!==false){g.globalAlpha=.22;g.fillRect(x1,y1,x2-x1,y2-y1);g.globalAlpha=1}g.lineWidth=o.w||2;g.strokeRect(x1,y1,x2-x1,y2-y1)}
  else{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
  g.lineWidth=1;if(o.src=='auto'){g.font='11px system-ui';g.fillText(o.type+' ·a',Math.min(x1,x2)+3,Math.min(y1,y2)-4)}
 }
 if(sel&&show[sel.src]){for(const h of hpts(sel)){if(sel.locked){if(h.k=='m'){g.font='14px system-ui';g.fillStyle=cc('tx');g.textAlign='center';g.fillText('🔒',h.x,h.y-8);g.textAlign='start'}continue}g.beginPath();g.arc(h.x,h.y,h.k=='m'?9:7,0,7);g.fillStyle=cc('bg');g.fill();g.lineWidth=2;g.strokeStyle=h.k=='m'?v('--acc'):(sel.color||COL[sel.type]||COL.libre);g.stroke()}}
 g.restore();
}
function dseg(x,y,a,b,c,d){const dx=c-a,dy=d-b,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-a)*dx+(y-b)*dy)/l)):0;return Math.hypot(x-a-t*dx,y-b-t*dy)}
function hpts(o){
 const x1=xp(ix(o.t1)),x2=xp(ix(o.t2)),y1=yp(o.p1),y2=yp(o.p2),m={k:'m',x:(x1+x2)/2,y:(y1+y2)/2};
 return o.kind=='zone'?[{k:'11',x:x1,y:y1},{k:'21',x:x2,y:y1},{k:'22',x:x2,y:y2},{k:'12',x:x1,y:y2},m]:[{k:'a',x:x1,y:y1},{k:'b',x:x2,y:y2},m];
}
function hitH(o,x,y){let best=null,bd=28;for(const h of hpts(o)){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
function hitObj(x,y){
 let best=null,bd=24;
 O.forEach(o=>{if(!show[o.src])return;const x1=xp(ix(o.t1)),x2=xp(ix(o.t2)),y1=yp(o.p1),y2=yp(o.p2);let d;
  if(o.kind=='zone'){const l=Math.min(x1,x2),r=Math.max(x1,x2),t=Math.min(y1,y2),b=Math.max(y1,y2),dx=Math.max(l-x,0,x-r),dy=Math.max(t-y,0,y-b);d=dx||dy?Math.hypot(dx,dy):10}
  else d=dseg(x,y,x1,y1,x2,y2);
  if(d<=bd){bd=d;best=o}});
 return best;
}
function dragH(e){
 const o=dh.o,k=dh.k,tx=e.offsetX-dh.ox,ty=e.offsetY-dh.oy;
 if(k=='m'){const x1=xp(ix(o.t1)),x2=xp(ix(o.t2)),y1=yp(o.p1),y2=yp(o.p2),di=(tx-(x1+x2)/2)/(W-AX)*N,dp=-(ty-(y1+y2)/2)/(H-BY)*(hi-lo);
  o.t1=tm(ix(o.t1)+di);o.t2=tm(ix(o.t2)+di);o.p1+=dp;o.p2+=dp}
 else if(k=='a'){o.t1=px(tx);o.p1=py(ty)}
 else if(k=='b'){o.t2=px(tx);o.p2=py(ty)}
 else{o['t'+k[0]]=px(tx);o['p'+k[1]]=py(ty)}
}
function sync(){
 if(sel&&(!O.includes(sel)||!show[sel.src]))sel=null;
 $('#pop').hidden=!sel;
 if(sel){
  $('#plk').textContent=sel.locked?'Débloquer':'Bloquer';$('#ppa').disabled=!clip;
  const z=sel.kind=='zone',f=sel.fill!==false;$('#plf').hidden=!z;$('#pfp').classList.toggle('on',z&&f);$('#pfv').classList.toggle('on',z&&!f);
  if(sel!==lastSel){$('#pco').value=hex(sel.color||COL[sel.type]||COL.libre);$('#pw').value=String(sel.w||2)}
 }
 lastSel=sel;
}
function info(){if(M)st(`${act?act.name+' · ':''}${M.t.length} bougies M1 · ${iso(M.t[0])} → ${iso(M.t[M.t.length-1])} · ${O.filter(o=>o.src=='manuel').length} manuel, ${O.filter(o=>o.src=='auto').length} auto`)}

cv.onpointerdown=e=>{
 cv.setPointerCapture(e.pointerId);const ax=len()&&e.offsetX>W-AX;P.set(e.pointerId,{x:e.offsetX,y:e.offsetY,sx:e.offsetX,sy:e.offsetY,axis:ax});
 if(P.size==2){dr=null;dh=null;multi=1;pacc=0}
 else if(len()&&!ax){
  const h=sel&&!sel.locked?hitH(sel,e.offsetX,e.offsetY):null;
  if(h)dh={o:sel,k:h.k,ox:e.offsetX-h.x,oy:e.offsetY-h.y};
  else if(tool=='seg'||tool=='zone'){const kind=tool;dr={kind,type:tp,src:'manuel',color:drawDefaults[kind]||null,t1:px(e.offsetX),p1:py(e.offsetY),t2:px(e.offsetX),p2:py(e.offsetY)}};
 }
};
cv.onpointermove=e=>{
 const p=P.get(e.pointerId);if(!p||!len())return;
 if(p.axis&&P.size==1){if(ml==null){ml=lo;mh=hi}const k=Math.exp((e.offsetY-p.y)*.006),c=(ml+mh)/2,h=Math.max((mh-ml)/2*k,1e-7);ml=c-h;mh=c+h;p.y=e.offsetY;draw();return}
 if(P.size==2){
  const [a,b]=[...P.values()],d0=Math.hypot(a.x-b.x,a.y-b.y),mx0=(a.x+b.x)/2,my0=(a.y+b.y)/2;p.x=e.offsetX;p.y=e.offsetY;
  const d1=Math.hypot(a.x-b.x,a.y-b.y),mx1=(a.x+b.x)/2,my1=(a.y+b.y)/2;
  if(d0>10&&d1>10){const m=mx1/(W-AX),c=X0+m*N;N*=d0/d1;clamp();X0=c-m*N}
  X0-=(mx1-mx0)/(W-AX)*N;pacc+=my1-my0;
  if(ml==null&&Math.abs(pacc)>12){ml=lo;mh=hi}
  if(ml!=null){const dy=(my1-my0)/(H-BY)*(mh-ml);ml+=dy;mh+=dy}
 }else if(dh)dragH(e);
 else if(dr){dr.t2=px(e.offsetX);dr.p2=py(e.offsetY)}
 else if(tool=='pan'){X0-=(e.offsetX-p.x)/(W-AX)*N;if(ml==null&&Math.abs(e.offsetY-p.sy)>12){ml=lo;mh=hi}if(ml!=null){const dy=(e.offsetY-p.y)/(H-BY)*(mh-ml);ml+=dy;mh+=dy}p.x=e.offsetX;p.y=e.offsetY}
 clamp();draw();
};
cv.onpointerup=cv.onpointercancel=e=>{
 const p=P.get(e.pointerId);P.delete(e.pointerId);if(!p)return;
 const mv=Math.hypot(e.offsetX-p.sx,e.offsetY-p.sy)>8,up=e.type=='pointerup',solo=!multi;if(!P.size)multi=0;
 if(solo&&up&&!mv)closePops();
 if(dh){if(!mv&&up&&solo)sel=null;dh=null}
 else if(dr){if(mv&&up&&solo){O.push(dr);sel=dr;setTool('pan')}dr=null}
 else if(solo&&up&&!mv&&!p.axis&&tool=='pan'&&len()){const h=hitObj(e.offsetX,e.offsetY);sel=h&&h!==sel?h:null}
 if(p.axis&&!mv&&up&&solo){const n=Date.now();if(n-(cv._lt||0)<350){ml=mh=null;cv._lt=0}else cv._lt=n}
 info();draw();
};

$('#load').onclick=()=>$('#f').click();
$('#f').onchange=async e=>{
 const fl=[...e.target.files];e.target.value='';
 for(const f of fl){
  st(`Lecture de ${f.name}…`);
  try{
   const m=parse(await f.arrayBuffer());
   if(!m.t.length){st(`Aucune bougie reconnue dans ${f.name}. Vérifie que c’est un export M1 de MT5.`);continue}
   await addChart(f.name.replace(/\.[^.]*$/,''),m);
  }catch(x){st('Erreur de lecture du fichier.')}
 }
};
$('#tf').onchange=e=>{if(M){setTF(+e.target.value);draw()}else tf=+e.target.value};
const setTool=t=>{tool=t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t==t))};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{dr=null;setTool(tool==b.dataset.t?'pan':b.dataset.t)});
$('#pcp').onclick=()=>{if(sel){clip=JSON.parse(JSON.stringify(sel));delete clip.locked;st('Objet copié.');draw()}};
$('#ppa').onclick=()=>{if(!clip||!len())return;const o=JSON.parse(JSON.stringify(clip));o.src='manuel';
 const di=X0+N/2-(ix(o.t1)+ix(o.t2))/2,dp=(lo+hi)/2-(o.p1+o.p2)/2;
 o.t1=tm(ix(o.t1)+di);o.t2=tm(ix(o.t2)+di);o.p1+=dp;o.p2+=dp;O.push(o);sel=o;info();draw()};
$('#pde').onclick=()=>{const k=O.indexOf(sel);if(k>=0)O.splice(k,1);sel=null;info();draw()};
$('#plk').onclick=()=>{if(sel){sel.locked=!sel.locked;draw()}};
$('#pco').oninput=e=>{if(sel){sel.color=e.target.value;drawDefaults[sel.kind]=e.target.value;saveDrawDefaults();draw()}};
$('#pw').onchange=e=>{if(sel){sel.w=+e.target.value;draw()}};
$('#pfp').onclick=()=>{if(sel&&sel.kind=='zone'){sel.fill=true;draw()}};
$('#pfv').onclick=()=>{if(sel&&sel.kind=='zone'){sel.fill=false;draw()}};
const closePops=()=>{$('#mn').hidden=true;$('#ap').hidden=true};
$('#mb').onclick=()=>{$('#ap').hidden=true;$('#mn').hidden=!$('#mn').hidden};
$('#mn').onclick=e=>{if(e.target.closest('button'))$('#mn').hidden=true};
$('#an').onclick=()=>{$('#mn').hidden=true;sel=null;const ap=$('#ap');ap.hidden=!ap.hidden;draw()};
$('#aok').onclick=()=>{
 $('#ap').hidden=true;
 if(!M)return st('Charge d’abord un CSV.');
 const a=$('#d1').value?Date.parse($('#d1').value+'Z')/1000:-Infinity,b=$('#d2').value?Date.parse($('#d2').value+'Z')/1000:Infinity;
 let i0=0;while(i0<M.t.length&&M.t[i0]<a)i0++;let i1=i0;while(i1<M.t.length&&M.t[i1]<=b)i1++;
 if(i1<=i0)return st('Aucune bougie dans cette période.');
 const m={};for(const k in M)m[k]=M[k].slice(i0,i1);
 const r=ANALYSE(m).map(o=>({...o,src:'auto'}));
 O=O.filter(o=>o.src!='auto').concat(r);draw();
 st(`Analyse du ${iso(m.t[0])} au ${iso(m.t[m.t.length-1])} (${m.t.length} bougies) : ${r.length} objet(s).`);
};
$('#au').onclick=()=>{O=O.filter(o=>o.src!='auto');info();draw()};
$('#av').onclick=()=>{if(!len())return;const f=t=>iso(t).replace(' ','T');$('#d1').value=f(tm(Math.max(0,X0)));$('#d2').value=f(tm(Math.min(len()-1,X0+N)));draw()};
$('#d1').onchange=$('#d2').onchange=draw;
$('#vm').onclick=e=>{show.manuel^=1;e.target.classList.toggle('on',!!show.manuel);draw()};
$('#va').onclick=e=>{show.auto^=1;e.target.classList.toggle('on',!!show.auto);draw()};
$('#dt').onclick=()=>$('#ov').hidden=false;
$('#cl').onclick=()=>$('#ov').hidden=true;
$('#ex').onclick=()=>$('#ta').value=JSON.stringify(O);
$('#im').onclick=()=>{
 try{const a=JSON.parse($('#ta').value);if(!Array.isArray(a))throw 0;O=O.concat(a.filter(o=>o&&o.t1!=null&&o.p1!=null&&o.t2!=null&&o.p2!=null));info();draw();$('#ov').hidden=true}
 catch(x){st('JSON invalide : rien n’a été importé.')}
};
$('#cp').onclick=()=>{const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(x){document.execCommand('copy')}};
/* Couleurs par défaut des tracés : mémorisées séparément pour segments et rectangles */
let drawDefaults={};
try{const saved=JSON.parse(localStorage.getItem('viz-draw-defaults')||'{}');for(const k of ['seg','zone'])if(/^#[0-9a-f]{6}$/i.test(saved[k]||''))drawDefaults[k]=saved[k]}catch(x){}
const saveDrawDefaults=()=>{try{localStorage.setItem('viz-draw-defaults',JSON.stringify(drawDefaults))}catch(x){}};
/* Couleurs */
const CI={up:'#cu',dn:'#cd',bg:'#cg',grid:'#cr',tx:'#ct'};
try{const s=JSON.parse(localStorage.getItem('viz-colors')||'{}');for(const k in CI)if(/^#[0-9a-f]{6}$/i.test(s[k]))CC[k]=s[k]}catch(x){}
const svC=()=>{try{localStorage.setItem('viz-colors',JSON.stringify(CC))}catch(x){}};
const hex=s=>{s=(s||'').trim();if(/^#[0-9a-f]{6}$/i.test(s))return s;if(/^#[0-9a-f]{3}$/i.test(s))return'#'+[...s.slice(1)].map(c=>c+c).join('');return'#000000'};
const fillC=()=>{const css=getComputedStyle(document.documentElement);for(const k in CI)$(CI[k]).value=hex(CC[k]||css.getPropertyValue(CM[k]))};
$('#cb').onclick=()=>{const p=$('#cs');if(p.hidden)fillC();p.hidden=!p.hidden};
$('#cok').onclick=()=>{const css=getComputedStyle(document.documentElement);for(const k in CI){const cur=hex(CC[k]||css.getPropertyValue(CM[k])),nv=$(CI[k]).value;if(nv.toLowerCase()!=cur.toLowerCase())CC[k]=nv}svC();$('#cs').hidden=true;draw()};
$('#crs').onclick=()=>{CC={};svC();fillC();draw()};
/* Plein écran */
const fs=on=>{document.body.classList.toggle('fs',on);if(!on)document.body.classList.remove('tbo');$('#cs').hidden=true;
 try{if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(x){}};
$('#fsb').onclick=()=>fs(!document.body.classList.contains('fs'));
$('#fx').onclick=()=>fs(false);
$('#tbo').onclick=()=>document.body.classList.toggle('tbo');
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs'))fs(false)});
/* Échelle et mouvement */



/* Graphiques multiples et sauvegarde (IndexedDB) */
const idb={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('viz-m1',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(x){res(false)}})},
 get(k){return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(x){res(undefined)}})},
 set(k,v){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=t.onabort=()=>res(false)}catch(x){res(false)}})},
 del(k){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res(true);t.onerror=t.onabort=()=>res(false)}catch(x){res(false)}})}
};
const freshS=()=>({tf,O:[],N:null,X0:0,ml:null,mh:null,d1:'',d2:'',sh:{manuel:1,auto:1}});
const snap=()=>({tf,O,X0,N,ml,mh,d1:$('#d1').value,d2:$('#d2').value,sh:{manuel:show.manuel,auto:show.auto}});
function save(){if(!act)return;act.S=snap();idb.set('s:'+act.id,act.S)}
function saveSoon(){if(!act)return;clearTimeout(tmr);tmr=setTimeout(save,700)}
function saveMeta(){idb.set('meta',{active:act?act.id:null,charts:charts.map(c=>({id:c.id,name:c.name}))})}
function apply(rec){
 const S=rec.S;M=rec.M||null;B=null;O=S.O||[];ml=S.ml==null?null:S.ml;mh=S.mh==null?null:S.mh;sel=null;dr=null;dh=null;
 show.manuel=S.sh?S.sh.manuel:1;show.auto=S.sh?S.sh.auto:1;$('#vm').classList.toggle('on',!!show.manuel);$('#va').classList.toggle('on',!!show.auto);
 $('#d1').value=S.d1||'';$('#d2').value=S.d2||'';
 tf=S.tf||1;$('#tf').value=String(tf);N=S.N||150;X0=S.X0||0;
 if(M){setTF(tf);if(S.N==null){N=Math.min(150,len());clamp();X0=len()-N+5;clamp()}}
}
function renderTabs(){
 const menu=$('#graphMenu'),btn=$('#graphsBtn');
 btn.textContent=act?`${act.name} ▾`:`Graphiques (${charts.length}) ▾`;
 btn.title=act?`Graphique actif : ${act.name}`:'Afficher les graphiques';
 btn.hidden=!charts.length;
 menu.textContent='';
 for(const c of charts){
  const row=document.createElement('div');row.className='graphItem'+(c===act?' active':'');
  const name=document.createElement('button');name.className='graphName';name.textContent=c.name;name.title=c.name;
  name.onclick=async()=>{menu.hidden=true;btn.setAttribute('aria-expanded','false');await switchTo(c.id)};
  const close=document.createElement('button');close.className='graphClose';close.textContent='✕';close.title=`Fermer ${c.name}`;
  close.onclick=async()=>{if(await ask(`Voulez-vous vraiment fermer le graphique « ${c.name} » ? Ses tracés seront perdus.`))delChart(c.id);renderTabs()};
  row.append(name,close);menu.append(row);
 }
}
$('#graphsBtn').onclick=()=>{const menu=$('#graphMenu');menu.hidden=!menu.hidden;$('#graphsBtn').setAttribute('aria-expanded',String(!menu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('#graphsBtn')&&!e.target.closest('#graphMenu')){$('#graphMenu').hidden=true;$('#graphsBtn').setAttribute('aria-expanded','false')}});
const ask=t=>new Promise(res=>{$('#cft').textContent=t;$('#cf').hidden=false;const f=v=>{$('#cf').hidden=true;res(v)};$('#cfy').onclick=()=>f(true);$('#cfn').onclick=()=>f(false)});
$('#cf').onclick=e=>{if(e.target.id=='cf')$('#cfn').click()};
async function switchTo(id){
 const rec=charts.find(c=>c.id==id);if(!rec||busy||act===rec)return;busy=1;
 try{
  if(act){act.S=snap();idb.set('s:'+act.id,act.S);if(act.saved)act.M=null}
  if(!rec.M&&!rec.missing){st('Chargement…');rec.M=(await idb.get('d:'+id))||null;if(rec.M)rec.saved=1;else rec.missing=1}
  act=rec;apply(rec);renderTabs();
  if(rec.missing)st(`Données de « ${rec.name} » introuvables : recharge le CSV.`);else info();
  draw();saveMeta();
 }finally{busy=0}
}
async function addChart(name,m){
 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 let nm=name,i=2;while(charts.some(c=>c.name==nm))nm=name+' ('+i+++')';
 const rec={id,name:nm,M:m,S:freshS()};charts.push(rec);
 st(`Enregistrement de ${nm}…`);
 rec.saved=await idb.set('d:'+id,m);
 await switchTo(id);
 if(!rec.saved)st('Graphique créé, mais non enregistré (stockage indisponible ou plein).');
}
async function delChart(id){
 const i=charts.findIndex(c=>c.id==id);if(i<0)return;const rec=charts[i];
 charts.splice(i,1);idb.del('d:'+id);idb.del('s:'+id);
 if(act===rec){
  act=null;const n=charts[Math.min(i,charts.length-1)];
  if(n)await switchTo(n.id);
  else{M=null;B=null;O=[];ml=mh=null;sel=null;renderTabs();st('Charge un CSV M1 exporté de MT5.');draw();saveMeta()}
 }else{renderTabs();saveMeta()}
}
async function init(){
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
 if(!await idb.open())return;
 const meta=await idb.get('meta');if(!meta||!meta.charts||!meta.charts.length)return;
 for(const c of meta.charts){const S=await idb.get('s:'+c.id);charts.push({id:c.id,name:c.name,M:null,saved:1,S:S||freshS()})}
 await switchTo(charts.some(c=>c.id==meta.active)?meta.active:charts[0].id);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
addEventListener('resize',draw);new ResizeObserver(draw).observe($('#c'));draw();init();
})();
</script></body></html>
